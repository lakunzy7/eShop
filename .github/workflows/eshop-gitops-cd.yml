name: eShop build + GitOps update

# Triggers: push to integration branch (src or workflow changes), PR, or manual dispatch.
on:
  push:
    branches: [cloudopshub/k8s-integration]
    paths:
      - 'src/**'
      - '.github/workflows/eshop-gitops-cd.yml'
  pull_request:
    branches: [cloudopshub/k8s-integration]
    paths:
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: lakunzy7
  DOTNET_VERSION: '10.0.x'

jobs:
  security-scan:
    name: Security scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@44c470ffc35caa8b1eb3e8012ca53c2f9bea4eb5  # v2.3.6
        env:
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # 0.35.0
        with:
          scan-type: fs
          scan-ref: src
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@8c78abb9b62512e3c45dea6559ffd924ed8549c8  # v3.28.0
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  build-push-images:
    name: Build & push container (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [security-scan]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      id-token: write   # for OIDC cosign signing if added later

    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: catalog-api, project: src/Catalog.API/Catalog.API.csproj }
          - { name: basket-api,  project: src/Basket.API/Basket.API.csproj  }
          - { name: order-api,   project: src/Ordering.API/Ordering.API.csproj }
          - { name: web,         project: src/WebApp/WebApp.csproj          }

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25  # v4.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y%m%d-%H%M)"
          echo "tag=${DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_OWNER}/eshop/${{ matrix.service.name }}" >> "$GITHUB_OUTPUT"

      - name: Publish container (.NET SDK)
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          TAG:   ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          dotnet publish "${{ matrix.service.project }}" \
            -c Release \
            -t:PublishContainer \
            -p:ContainerRegistry="${REGISTRY}" \
            -p:ContainerRepository="${IMAGE_OWNER}/eshop/${{ matrix.service.name }}" \
            -p:ContainerImageTags="\"${TAG};latest\"" \
            -p:ContainerUser=1000

      - name: Job summary
        run: |
          {
            echo "## ${{ matrix.service.name }} pushed"
            echo "- image: \`${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}\`"
            echo "- also tagged: \`latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  update-gitops:
    name: Update GitOps overlay (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build-push-images
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0  # v2.12.0
        with:
          egress-policy: audit

      - name: Compute image tag
        id: tag
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y%m%d-%H%M)"
          echo "tag=${DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout multi-cluster-deployment
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: lakunzy7/multi-cluster-deployment
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: deploy
          persist-credentials: true

      - name: Install kustomize
        run: |
          set -euo pipefail
          curl -sLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize

      - name: Update dev overlay image tags
        working-directory: deploy/eshop-config/overlays/dev
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Kargo Warehouse will discover the new image tag, but no auto-promote
          # happens (autoPromotionEnabled=false everywhere). Operator must run
          # `kargo promote --stage dev` to actually deploy.
          for svc in catalog-api basket-api order-api web; do
            kustomize edit set image "ghcr.io/lakunzy7/eshop/${svc}=ghcr.io/lakunzy7/eshop/${svc}:${TAG}"
          done
          echo "--- updated kustomization.yaml ---"
          cat kustomization.yaml

      - name: Commit and push
        working-directory: deploy
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add eshop-config/overlays/dev/kustomization.yaml
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "ci(eshop): bump dev image tags to ${TAG}" \
                     -m "Source build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                     -m "Source commit: ${{ github.sha }}"
          git push

      - name: Job summary
        run: |
          {
            echo "## GitOps overlay updated"
            echo "- env: dev"
            echo "- tag: \`${{ steps.tag.outputs.tag }}\`"
            echo ""
            echo "Kargo Warehouse will pick up the new Freight. Promote with:"
            echo "\`\`\`bash"
            echo "kargo promote --project eshop --stage dev"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
